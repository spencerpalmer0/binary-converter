<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Converter</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:25px}
main{max-width:500px;margin:auto;background:#1e293b;padding:30px;border-radius:16px}
input,select{width:100%;padding:13px;margin:10px 0;box-sizing:border-box;border-radius:8px;border:0}
button{width:100%;background:#0284c7;color:white;padding:14px;border:0;border-radius:8px;cursor:pointer}
#result{background:#334155;padding:20px;margin-top:20px;border-radius:8px;line-height:2;white-space:pre-line;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Binary Converter</h1>
<p>Convert numbers between different number systems.</p>
<input id="number" placeholder="Enter a number">
<select id="base">
<option value="10">Decimal</option>
<option value="2">Binary</option>
<option value="16">Hexadecimal</option>
</select>
<button onclick="convert()">Convert Number</button>
<div id="result">Your result will appear here.</div>
</main>
<script>
function convert(){
 const text=document.getElementById("number").value.trim();
 const base=Number(document.getElementById("base").value);
 const out=document.getElementById("result");
 const patterns={10:/^[0-9]+$/,2:/^[01]+$/,16:/^[0-9a-f]+$/i};
 if(!patterns[base].test(text)){
  out.textContent="Enter a valid number.";
  return;
 }
 try{
  const n=BigInt((base===2?"0b":base===16?"0x":"")+text);
  out.textContent="Decimal: "+n.toString(10)+
  "\nBinary: "+n.toString(2)+
  "\nHexadecimal: "+n.toString(16).toUpperCase();
 }catch{
  out.textContent="Unable to convert this number.";
 }
}
</script>
</body>
</html>
