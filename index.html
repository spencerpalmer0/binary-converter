<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binary Converter</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;padding:13px;box-sizing:border-box;margin:12px 0}
button{padding:12px 18px;background:#334155;color:white;border:0;border-radius:7px;cursor:pointer}
#result{background:#e2e8f0;padding:15px;margin-top:15px;border-radius:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Binary Converter</h1>
<h3>Decimal to Binary</h3>
<input id="decimal" type="number" step="1" placeholder="Enter decimal integer">
<button onclick="toBinary()">Convert to Binary</button>
<h3>Binary to Decimal</h3>
<input id="binary" placeholder="Enter binary number">
<button onclick="toDecimal()">Convert to Decimal</button>
<div id="result">Conversion result appears here.</div>
</main>
<script>
const result=document.getElementById("result");
function toBinary(){
 const value=document.getElementById("decimal").value.trim();
 if(value===""||!Number.isSafeInteger(Number(value))){
  result.textContent="Enter a valid safe integer.";
  return;
 }
 result.textContent=BigInt(value).toString(2);
}
function toDecimal(){
 const value=document.getElementById("binary").value.trim();
 if(!/^[01]+$/.test(value)){
  result.textContent="Enter a valid binary number containing only 0 and 1.";
  return;
 }
 result.textContent=BigInt("0b"+value).toString(10);
}
</script>
</body>
</html>
